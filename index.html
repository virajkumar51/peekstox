    <script>
      // 1. Ensure window.fetch is writable and has both getter and setter.
      // This prevents "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // when test runners, sandboxes, or browser extensions attempt to wrap/intercept window.fetch.
      (function () {
        try {
          var origFetch = window.fetch;
          var activeFetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;

          var fetchDescriptor = {
            get: function () {
              return activeFetch;
            },
            set: function (newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          };

          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (_) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (_) {}
          }

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', fetchDescriptor);
            } catch (_) {}
          }
        } catch (_) {}
      })();

      // 2. Gracefully silence benign network/transport errors in sandbox environment
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var src = (e && e.filename) ? String(e.filename) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('NetworkError') ||
          msg.includes('Failed to fetch') ||
          msg.includes('Load failed') ||
          msg.includes('Cannot set property fetch') ||
          src.includes('chrome-extension://') ||
          src.includes('@vite/client') ||
          (e && e.error && e.error.stack && (
            e.error.stack.includes('createWebSocketModuleRunnerTransport') ||
            e.error.stack.includes('chrome-extension://')
          ))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        var msg = (reason && reason.message) ? String(reason.message) : (typeof reason === 'string' ? reason : '');
        var stack = (reason && reason.stack) ? String(reason.stack) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('NetworkError') ||
          msg.includes('Failed to fetch') ||
          msg.includes('Load failed') ||
          msg.includes('Cannot set property fetch') ||
          stack.includes('chrome-extension://') ||
          stack.includes('createWebSocketModuleRunnerTransport')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
