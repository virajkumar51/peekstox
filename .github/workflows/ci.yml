name: PeekStox CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build, Lint & Verify Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Test Suites (Quant Core & Simulator)
        run: npm test

      - name: Build Production Frontend
        run: npm run build
